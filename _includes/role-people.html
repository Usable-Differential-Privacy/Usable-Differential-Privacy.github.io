{% assign role_key = include.role %}
<section class="people-section role-{{ role_key }}" aria-labelledby="role-{{ role_key }}">
  <h2 id="role-{{ role_key }}">{{ include.title }}</h2>
  <div class="people-grid">
    {% for item in site.data.people %}
      {% assign person = item[1] %}
      {% if person.role == role_key %}
          {% include person.html person=person %}
      {% endif %}
    {% endfor %}
  </div>
</section>
